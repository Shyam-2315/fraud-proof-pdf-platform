name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - "27017:27017"
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: "8025"
      FRONTEND_URL: http://localhost:3025
      ADMIN_FRONTEND_URL: http://localhost:3035
      BACKEND_PUBLIC_URL: http://localhost:8025
      CORS_ORIGINS: '["http://localhost:3025","http://localhost:3035"]'
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: fraud_pdf_ci
      TEST_MONGO_URL: mongodb://localhost:27017
      TEST_MONGO_DB_NAME: fraud_pdf_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-value-that-is-long-enough
      ADMIN_API_KEY: ci-admin-key-that-is-long-enough
      ENABLE_DEFAULT_ADMIN_SEED: "true"
      DEFAULT_ADMIN_EMAIL: admin@pdfcraft.local
      DEFAULT_ADMIN_PASSWORD: AdminPassword123
      SECURE_COOKIES: "false"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Start backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8025 > /tmp/pdfcraft-backend.log 2>&1 &
          echo $! > /tmp/pdfcraft-backend.pid
          for i in {1..40}; do
            if curl -fsS http://localhost:8025/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pdfcraft-backend.log
          exit 1
      - name: Run backend tests
        run: pytest tests -q
      - name: Print backend logs on failure
        if: failure()
        run: cat /tmp/pdfcraft-backend.log || true

  customer-frontend:
    name: Customer frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  admin-frontend:
    name: Admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdfcraft-guardian-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pdfcraft-guardian-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
      - name: Build customer frontend image
        run: docker build -f frontend/Dockerfile frontend
      - name: Build admin frontend image
        run: docker build -f pdfcraft-guardian-main/Dockerfile pdfcraft-guardian-main
